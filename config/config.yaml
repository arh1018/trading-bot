# ===========================================================================
# nbtrend -- trend following on Nobitex rial markets
# ===========================================================================

data:
  # Bar size the strategy runs on. Trading costs on Nobitex (see `costs`)
  # are ~0.5% round trip, so sub-hourly trend following is not viable.
  # 240 -> 720. Measured across 6 symbols with the REAL 62bps median spread
  # (not the 10bps the model assumed):
  #     4h : Sharpe 1.04, +38.9%, 48 trades, costs 16.9% of equity
  #     12h: Sharpe 0.95, +32.1%, 15 trades, costs  5.0%
  #     D  : Sharpe 0.86, +31.1%,  5 trades, costs  1.9%
  # 4h wins on point estimate, but spends 16.9% of equity to earn 38.9% -- and
  # that uses the MEDIAN spread, while the book holds thin alts where spreads
  # are far wider. 12h keeps most of the return with a third of the cost
  # exposure, so it survives the cost assumption being wrong. That assumption
  # is the one least worth trusting.
  timeframe: "720"            # Nobitex/TV resolution: 60,180,240,360,720,D
  warmup_bars: 400            # bars of history needed before the first signal
  history_days: 900           # how far back `nbtrend fetch` pulls
  cache_dir: "data/candles"
  # Bounded fan-out for a large universe. Too high trips Nobitex per-IP
  # rate limits and opens too many TradingView sockets at once.
  max_concurrent_fetches: 8

  # Minimum seconds between refetching a symbol's candles. Signals are derived
  # from CLOSED bars, so refetching a 4h bar every couple of minutes cannot
  # change a decision -- it only spends rate limit. Short cycles remain useful
  # because fills, drift and stops are evaluated against the live websocket
  # book, which costs nothing.
  min_refetch_s: 240

  # Drop a symbol whose global feed has not printed in this long. A delisted
  # pair does not error -- Binance still serves the last bars it ever had
  # (XMRUSDT returns February 2024), so the price silently freezes while the
  # local market keeps moving.
  max_feed_age_days: 3

  # tradingview | binance.
  #
  # TradingView aggregates many venues and needs no key, but its anonymous
  # datafeed rate-limits concurrent sockets (HTTP 429). That is fine for a
  # handful of symbols and unusable for a 100+ universe, where every symbol
  # fails over to Binance anyway after paying for a rejected connection.
  # Binance is documented, versioned, keyless and weight-limited -- the right
  # default at this size. Switch back to tradingview for a small universe.
  global_feed: "binance"
  tradingview_failure_limit: 3   # consecutive failures before the breaker trips
  tradingview:
    # Unofficial, unauthenticated TradingView datafeed. No key required.
    # It is scraped, not contractual -- `binance` is the drop-in fallback.
    ws_url: "wss://data.tradingview.com/socket.io/websocket?from=chart%2F"
    origin: "https://www.tradingview.com"
    auth_token: "unauthorized_user_token"
    max_bars: 5000
    timeout_s: 30

  nobitex:
    rest_url: "https://apiv2.nobitex.ir"
    testnet_rest_url: "https://testnetapi.nobitex.ir"
    ws_url: "wss://ws.nobitex.ir/connection/websocket"
    testnet_ws_url: "wss://testnetws.nobitex.ir/connection/websocket"

# ---------------------------------------------------------------------------
# Signal. The composite score is a weighted blend of three trend estimators,
# each mapped to [-1, +1], computed on the GLOBAL (USD) price series.
# See docs in src/nbtrend/features/signals.py for the reasoning.
# ---------------------------------------------------------------------------
strategy:
  name: "trend_following"

  signal:
    # Baz et al. (2015) normalised MACD -- the standard CTA trend metric.
    macd:
      weight: 0.5
      pairs: [[8, 24], [16, 48], [32, 96]]   # (fast, slow) EMA halflives
      short_norm_window: 63                  # std window for the raw MACD
      long_norm_window: 252                  # std window for the normalised
    # Time-series momentum, volatility-scaled (Moskowitz/Ooi/Pedersen 2012).
    tsmom:
      weight: 0.3
      lookbacks: [30, 60, 120]
      vol_window: 60
    # Donchian channel breakout (Turtle). Pure price-level trend.
    donchian:
      weight: 0.2
      window: 55
      exit_window: 20

  # Regime gate: below this Kaufman efficiency ratio the market is chopping
  # and every trend estimator is noise. Signal is forced to flat.
  regime:
    efficiency_ratio_window: 30
    min_efficiency_ratio: 0.25
    adx_window: 14
    min_adx: 18.0

  # Hysteresis. Enter only above `entry`, exit only below `exit`. The gap is
  # what stops the book churning when the score oscillates around a level.
  thresholds:
    entry: 0.30
    exit: 0.10

  # Spot IRT markets cannot be sold short, so a short requires MARGIN (see the
  # `margin` block). Measured cost of enabling this: across 8 symbols, 0 of 8
  # improved, mean Sharpe -0.79 (scripts/short_study.py). Rial-denominated
  # crypto drifts upward with rial devaluation, so a short book fights the
  # carry while paying ~147bps a round trip.
  allow_short: false

# ---------------------------------------------------------------------------
risk:
  target_annual_vol: 0.35      # portfolio vol target (rial terms)
  max_weight_per_symbol: 0.35  # of equity
  max_gross_exposure: 1.0      # no leverage on spot

  # Cap on concurrent positions. 0 = derive it from equity, as
  # floor(equity * max_gross / min_order_rial): the most positions that can
  # each clear Nobitex's 3,000,000 rial minimum. This is what lets a wide
  # universe run on a small account -- the universe stays the opportunity set
  # and the book holds only the highest-conviction names that can be funded.
  max_positions: 0
  vol_window: 30               # bars, realised-vol estimate for sizing
  atr_window: 20
  atr_stop_mult: 3.0           # chandelier trailing stop
  max_drawdown_stop: 0.25      # flatten the book past this equity drawdown

  # The rial leg is a one-way carry: holding rial has historically lost value
  # against USD. `fx_floor_weight` keeps a minimum crypto allocation so that
  # being "flat" is not silently a 100% short-rial-devaluation bet.
  fx_floor_weight: 0.0

# ---------------------------------------------------------------------------
# Margin trading. Off by default: every order here can be liquidated, and a
# liquidation is permanent -- the collateral is seized and does not come back
# when the price does.
margin:
  # DISABLED on evidence. Measured: shorts improved 0 of 8 symbols, mean Sharpe
  # delta -0.79 -- rial-denominated crypto drifts UP with rial devaluation, so
  # a short book is a leveraged bet against the one force reliably paying here.
  # Live confirmation: the sleeve reached -437,212 unrealized before it was
  # closed, while the spot book carried the account.
  enabled: false             # master switch; nothing below applies while false

  # Collateral lives in a SEPARATE wallet and must be moved there first
  # (NobitexREST.transfer). Margin orders draw on it, not on spot.
  # NOTE: /wallets/transfer returns 401 with the current API key -- that scope
  # is not enabled, so the margin wallet cannot be funded yet.
  collateral_rial: 0

  # 1..5 in steps of 0.5 on this account. Measured: real borrowing only begins
  # above ~2x here (vol targeting keeps gross under 1 below that), and at 5x
  # Sharpe roughly halves (1.43 -> 0.81) for no extra return. Financing is
  # 0.05%/DAY (~18%/yr) on the borrowed amount, charged whether or not the
  # trade works. Set to 5 by explicit instruction.
  max_leverage: 5.0

  # Refuse to hold a position whose mark is within this fraction of its
  # liquidation price. Liquidation happens at the exchange BETWEEN our decision
  # cycles, so the drawdown stop cannot catch it -- this is the only guard.
  #
  # This threshold MUST be read against the leverage. Collateral at Nx is 1/N
  # of notional, so a freshly opened position starts roughly (1/N - maintenance)
  # away from liquidation:
  #     1x -> ~100%      2x -> ~45%      5x -> ~15%
  # At 5x a brand-new position therefore sits at ~0.15, so a 0.15 threshold
  # would flag every position from inception -- an alarm that is always on is
  # the same as no alarm. 0.05 keeps it meaningful at 5x.
  #
  # Be clear about what this cannot do: at 5x a 15% adverse move liquidates,
  # and alt markets can travel that far inside one 2-minute cycle. The guard
  # reduces exposure to a slow bleed; it cannot save a position from a gap.
  min_liquidation_distance: 0.05

  # Cap on how much of the book may be short at once.
  # NOTE: this is usually NOT the binding limit. The short budget is
  #   min(max_short_gross * equity, free_collateral * leverage * 0.8)
  # and with ~4.9M free collateral the second term (~19.6M) binds well below
  # 0.9 * equity (~81M). Raising this alone changes nothing; adding collateral
  # to the margin wallet is what actually increases short capacity.
  max_short_gross: 0.90

  # Concentration for the short book. Vol targeting spreads exposure across
  # every signal, which left each short at ~3.7M notional -- barely over the
  # 3,000,000 exchange minimum, so fees and spread ate a large share of any
  # move. This scales each short so the SAME budget lands in fewer, larger
  # positions; `max_short_gross` and the collateral ceiling still bind, so it
  # cannot increase total short exposure, only its concentration.
  short_size_multiplier: 2.5

# ---------------------------------------------------------------------------
costs:
  # Nobitex spot fees depend on your 30-day volume tier. These are the
  # account's actual rates (0.11%), not the 0.25%/0.30% entry-level defaults --
  # a ~2.5x difference that changes which timeframes are viable at all.
  # Re-check after any tier change; the whole cost argument below depends on it.
  # CORRECTED to the account's real tiers (they were 0.0011/0.0011, which
  # overstated costs by ~40% in every backtest run before this):
  #     IRT  market: maker 0.08%, taker 0.10%
  #     USDT market: maker 0.06%, taker 0.09%
  # `maker_fee`/`taker_fee` are the IRT pair, since the live book is IRT.
  maker_fee: 0.0008
  taker_fee: 0.0010
  maker_fee_irt: 0.0008
  taker_fee_irt: 0.0010
  maker_fee_usdt: 0.0006
  taker_fee_usdt: 0.0009
  # Modelled slippage as a fraction of price, applied on top of the fee.
  slippage: 0.0010
  min_order_rial: 3000000      # exchange minimum for IRT markets (300k Toman)

  # Margin borrow cost. Nobitex charges positionFeeRate as a DAILY renewal fee
  # on the delegated (borrowed) amount -- 0.05%/day on this account, which is
  # ~18%/year. Only applied when risk.max_leverage > 1. Treating borrowing as
  # free is what makes a backtest recommend leverage that loses money.
  position_fee_daily: 0.0005

execution:
  # No-trade band. Vol targeting makes the target weight drift a little every
  # bar; without a band the book rebalances continuously and pays ~0.4% each
  # time for a position change too small to matter. Only trade when the gap
  # between current and target weight exceeds this fraction of equity.
  # Lowered 0.05 -> 0.035 to raise turnover, but no lower: a trade must still
  # clear min_order_rial (3,000,000), which on a ~90M book is 0.033 of equity.
  # A band under that lets through adjustments the exchange simply rejects --
  # turnover on paper, skipped orders in practice.
  min_rebalance_weight: 0.035

  # Rial held back from the strategy entirely. Sizing runs on
  # (equity - cash_reserve_rial), and buys are clamped against it, so this
  # money stays put instead of being redeployed on the next dip.
  # Back to 0. This held 1,000,000 aside so it could be moved to the margin
  # wallet by hand (the API key has no wallet-transfer scope). That transfer is
  # done and margin is now disabled, so the reserve only starved the book: with
  # 2,961,353 rial of cash, holding 1,000,000 back left less than the 3,000,000
  # minimum order and no buy could be placed at all.
  cash_reserve_rial: 0

  # Incumbency hysteresis. With ~3 fundable slots on a small account, the last
  # slot flips on tiny score differences and each flip pays a full round trip
  # (0.22% fees plus the spread, measured at a 62bp median outside the majors).
  # A name already in the book keeps its slot unless a challenger's score beats
  # it by this margin. Scores are roughly -1..+1, so 0.10 is a real gap.
  # Lowered 0.10 -> 0.05 to rotate more readily. This is the anti-churn brake:
  # at 0 the last slot flips on noise and pays a full round trip (~147bps all
  # in) each time, which is what it was added to stop. 0.05 still requires a
  # visible edge to evict an incumbent.
  incumbent_score_bonus: 0.05

  # Nobitex credits a wallet ~2s AFTER the fill is acknowledged. Reading
  # balances inside that window returns pre-trade numbers, which makes the
  # next symbol in the rebalance loop over-estimate available cash. The
  # runner confirms the credit landed instead of assuming a fixed delay.
  # Wallet reads are cached for this long within a cycle. The rebalance loop
  # needs balances several times per symbol; uncached, a 25-symbol universe
  # earns a 429 from /users/wallets/list and loses the whole cycle. Every
  # order submission and settlement invalidates the cache, so it cannot hide
  # a fill.
  # Raised 3.0 -> 10.0 for 60s cycles. A shorter interval multiplies wallet
  # reads against a per-IP rate limit that is SHARED with margin reads; a 429
  # here aborts the entire rebalance, so the cache is what keeps short cycles
  # viable. Every submission and settlement still invalidates it, so it cannot
  # hide a fill.
  balance_ttl_s: 10.0

  settlement_poll_s: 0.5      # how often to re-read wallets while confirming
  settlement_timeout_s: 20    # give up confirming after this long

  order_type: "limit"          # limit | market
  limit_offset_bps: 5          # how far through the touch to post a limit
  repost_after_s: 45           # re-price an unfilled limit after this long
  max_reposts: 4               # then cross the spread
  poll_interval_s: 5
  # Refuse to trade if Nobitex's price deviates from global*fx by more than
  # this. Protects against stale feeds and local dislocations.
  max_basis_deviation: 0.05

backtest:
  initial_equity_rial: 1000000000   # 1e9 rial = 100M toman
  # Walk-forward: fit params on `train_days`, trade the next `test_days`,
  # roll forward. This is how `nbtrend optimize` avoids curve fitting.
  train_days: 365
  test_days: 90
