# ---------------------------------------------------------------------------
# Live universe -- top 25 IRT markets by 24h rial volume.
#
# This is the OPPORTUNITY SET, not the book. Nobitex rejects IRT orders under
# 3,000,000 rial, so the number of positions actually held is capped by
# `risk.max_positions` (0 = derive from equity). The strategy ranks these 25
# by conviction each cycle and funds only the top few that can clear the
# minimum -- at ~10M rial equity that is 3 positions.
#
# Add capital, not symbols, to hold more names: each concurrent position
# needs its own 3,000,000 rial.
#
# Select with:  NBTREND_UNIVERSE=config/universe.live.yaml
# ---------------------------------------------------------------------------

fx:
  nobitex: USDTIRT
  src: usdt
  dst: rls
  tradingview: null
  amount_step: 0.01
  price_step: 10
