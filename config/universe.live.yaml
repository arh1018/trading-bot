# ---------------------------------------------------------------------------
# Live universe -- every liquid IRT market with a working global feed.
#
# This is the OPPORTUNITY SET, not the book. Nobitex rejects IRT orders under
# 3,000,000 rial, so the number of positions actually held is bounded by
# capital, not by this list:
#
#     fundable = floor(equity * max_gross_exposure / min_order_rial)
#
# The strategy ranks these by conviction each cycle and funds the best few
# that can clear the minimum. Widening this list improves SELECTION -- it does
# not let you hold more names. For that, add capital: ~100M rial funds ~33
# positions, ~1B rial funds the whole list.
#
# Select with:  NBTREND_UNIVERSE=config/universe.live.yaml
# ---------------------------------------------------------------------------

