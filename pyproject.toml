[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbtrend"
version = "0.1.0"
description = "Trend-following algorithmic trading on Nobitex IRT markets, signalled from global (USD) prices"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "httpx>=0.27",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyarrow>=15.0",
    "tenacity>=8.2",
    "cryptography>=42.0",   # Ed25519 signing for Nobitex API keys
]

[project.optional-dependencies]
research = ["matplotlib>=3.8", "scipy>=1.12", "jupyterlab>=4.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.9"]

[project.scripts]
nbtrend = "nbtrend.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]
ignore = [
    # A trading loop must survive a bad tick, a flaky endpoint or a handler
    # bug rather than exiting and leaving positions unmanaged. Every broad
    # catch in this codebase logs and continues deliberately.
    "BLE001",
    # typer's documented idiom is a call in the argument default.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
